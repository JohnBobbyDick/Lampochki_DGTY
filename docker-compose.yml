services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env      # optional: GEMINI_API_KEY etc. (see backend/.env.example)
        required: false
    environment:
      # trust X-Forwarded-For (real client IP for the per-IP session limit) only from the compose network (nginx);
      # port 8000 is not published, so only nginx reaches the backend. Narrow it to your proxy's IP if exposed.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      - JAVA_SANDBOX_MODE=subprocess   # "docker" → run Java in the sandbox image (needs docker socket)
    mem_limit: 1g
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional hardened runner image: docker build -t lampochki-sandbox ./sandbox
  sandbox:
    build: ./sandbox
    image: lampochki-sandbox
    profiles: ["sandbox"]
