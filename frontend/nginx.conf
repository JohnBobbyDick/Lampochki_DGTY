map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # a reverse proxy on the host (Caddy) reaches nginx from the docker gateway: take the client IP it reports.
    # Direct visitors are not in this range, so they cannot spoof X-Forwarded-For.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # nginx is the edge: overwrite, never append the client's own header
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        client_max_body_size 5m;
    }

    location / {
        try_files $uri /index.html;
    }
}
